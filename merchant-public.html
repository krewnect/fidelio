<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Lealtad</title>
    <!-- FontAwesome y Google Fonts -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #111111;
            --surface-color: #1a1a1a;
            --text-color: #ffffff;
            --text-muted: #888888;
            --primary: #8b5cf6; 
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Banner Dinámico */
        .merchant-banner {
            width: 100%;
            height: 200px;
            background-color: var(--primary);
            background-size: cover;
            background-position: center;
            position: relative;
        }

        /* Logo superpuesto */
        .merchant-logo-container {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background-color: var(--surface-color);
            border: 4px solid var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .merchant-logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Contenido */
        .content-wrapper {
            padding: 60px 20px 20px 20px;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .merchant-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }

        .merchant-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 30px;
        }
        
        /* Campaigns Grid */
        .campaign-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            width: 100%;
            margin-bottom: 30px;
        }
        
        .campaign-card {
            background-color: var(--surface-color);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .campaign-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border-color: rgba(255,255,255,0.1);
        }
        
        .campaign-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background-color: var(--card-primary, var(--primary));
        }
        
        .campaign-type-badge {
            align-self: flex-start;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 8px;
            border-radius: 8px;
            background-color: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.8);
        }
        
        .campaign-name {
            font-size: 18px;
            font-weight: 600;
            color: white;
            margin: 0;
        }

        /* Formulario */
        form {
            width: 100%;
            background-color: var(--surface-color);
            padding: 24px;
            border-radius: 20px;
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.8);
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background-color: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-family: inherit;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: rgba(255,255,255,0.05);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }
        
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            width: 100%;
            padding: 16px;
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .btn-secondary:hover {
            background-color: rgba(255,255,255,0.05);
            color: white;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .footer img {
            height: 16px;
            border-radius: 4px;
        }
        
        #loading-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: white;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div id="loading-screen"><i class="fa-solid fa-spinner fa-spin"></i></div>

    <div class="merchant-banner" id="banner">
        <div class="merchant-logo-container">
            <img src="https://ui-avatars.com/api/?name=Cargando&background=333&color=fff" id="logo" alt="Logo">
        </div>
    </div>

    <div class="content-wrapper">
        <h1 class="merchant-name" id="merchant-name">Cargando...</h1>
        <p class="merchant-subtitle" id="merchant-subtitle">Únete a nuestro programa de lealtad y empieza a ganar recompensas exclusivas.</p>

        <!-- Campaigns Selection -->
        <div id="campaigns-container" style="width: 100%; display: none;">
            <div class="campaign-grid" id="campaign-grid">
                <!-- Campaigns will be injected here -->
            </div>
        </div>

        <!-- Registration Form -->
        <div id="registration-form-container" style="width: 100%; display: none;">
            <form id="public-register-form">
                <input type="hidden" id="merchant_id" name="merchant_id">
                
                <div style="margin-bottom: 20px; text-align: center;">
                    <span id="selected-campaign-badge" class="campaign-type-badge" style="background: var(--primary); color: white;"></span>
                </div>
                
                <div class="form-group">
                    <label>Tu Nombre Completo</label>
                    <input type="text" class="form-input" id="full_name" required placeholder="Ej. Juan Pérez">
                </div>

                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" class="form-input" id="email" required placeholder="juan@correo.com">
                </div>

                <div class="form-group" id="group-phone">
                    <label id="label-phone">Teléfono</label>
                    <input type="tel" class="form-input" id="phone" placeholder="55 1234 5678">
                </div>
                <div class="form-group" id="group-birthday" style="display: none;">
                    <label id="label-birthday">Cumpleaños</label>
                    <input type="date" class="form-input" id="birthday">
                </div>

                <button type="submit" class="btn-primary" id="btn-submit">Generar Mi Tarjeta Digital</button>
                <button type="button" class="btn-secondary" id="btn-back">Volver a Campañas</button>
            </form>
        </div>
    </div>

    <div class="footer">
        <img src="/fidelio_logo_white.png" alt="Fidelio" onerror="this.src='https://ui-avatars.com/api/?name=F&background=8b5cf6&color=fff&size=32'">
        <span>Powered by Fidelio</span>
    </div>

    <script>
        let supabase;
        let merchantData;
        let selectedCampaignId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // 1. Fetch config to init Supabase
                const configRes = await fetch('/api/config');
                const config = await configRes.json();
                supabase = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
                
                // 2. Get slug from URL or Subdomain
                const hostname = window.location.hostname;
                const parts = hostname.split('.');
                const ignoredSubdomains = ['www', 'app', 'panel', 'api', 'localhost', 'fideliorewards', '127'];
                let slug = '';

                if (parts.length >= 2 && !ignoredSubdomains.includes(parts[0])) {
                    slug = parts[0];
                } else {
                    slug = window.location.pathname.replace('/', '').toLowerCase();
                }
                
                if (!slug) {
                    Swal.fire('Error', 'Restaurante no especificado', 'error');
                    return;
                }

                // 3. Fetch Merchant by Username
                let { data, error } = await supabase
                    .from('merchants')
                    .select('*')
                    .filter('appointment_settings->landing_prefs->>username', 'eq', slug)
                    .limit(1)
                    .single();
                    
                if (error || !data) {
                    // Try by business name fallback just in case
                    let { data: fallbackData } = await supabase
                        .from('merchants')
                        .select('*')
                        .ilike('business_name', '%' + slug + '%')
                        .limit(1)
                        .single();
                        
                    if (fallbackData) {
                        data = fallbackData;
                    } else {
                        throw new Error('Merchant not found');
                    }
                }

                if (error || !data) {
                    throw new Error('Restaurante no encontrado');
                }

                merchantData = data;
                
                // Override con landing_prefs si existen
                const prefs = merchantData.appointment_settings?.landing_prefs || {};
                if (prefs.portal_color) merchantData.color_primary = prefs.portal_color;
                if (prefs.portal_logo) merchantData.logo_url = prefs.portal_logo;

                // 4. Apply Visual Branding
                document.getElementById('merchant_id').value = merchantData.id;
                document.getElementById('merchant-name').textContent = merchantData.business_name;
                document.title = `${merchantData.business_name} - Registro de Lealtad`;
                
                if (merchantData.color_primary) {
                    document.documentElement.style.setProperty('--primary', merchantData.color_primary);
                }
                
                if (merchantData.banner_url) {
                    document.getElementById('banner').style.backgroundImage = `url('${merchantData.banner_url}')`;
                }
                
                const logoEl = document.getElementById('logo');
                if (merchantData.logo_url) {
                    logoEl.src = merchantData.logo_url;
                } else {
                    logoEl.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(merchantData.business_name)}&background=${(merchantData.color_primary||'8b5cf6').replace('#','')}&color=fff&size=128`;
                }

                // 5. Fetch Campaigns
                const { data: campaigns, error: campError } = await supabase
                    .from('campaigns')
                    .select('*')
                    .eq('merchant_id', merchantData.id)
                    .eq('is_active', true);
                    
                if (campError) throw campError;
                
                let visibleCampaigns = campaigns || [];
                if (merchantData.business_type === 'professional') {
                    visibleCampaigns = visibleCampaigns.filter(c => c.type === 'stamps');
                    document.getElementById('merchant-subtitle').textContent = "Selecciona tu programa y regístrate para obtener tu tarjeta.";
                }

                const grid = document.getElementById('campaign-grid');
                if (visibleCampaigns.length === 0) {
                    grid.innerHTML = '<p style="text-align:center; color:var(--text-muted);">No hay campañas activas en este momento.</p>';
                } else {
                    visibleCampaigns.forEach(camp => {
                        const card = document.createElement('div');
                        card.className = 'campaign-card';
                        if (camp.color_primary) {
                            card.style.setProperty('--card-primary', camp.color_primary);
                        }
                        
                        let typeLabel = 'Campaña';
                        let purposeHtml = '';
                        let termsHtml = '';

                        if (camp.type === 'stamps') typeLabel = 'Sellos';
                        else if (camp.type === 'cashback') typeLabel = 'Cashback';
                        else if (camp.type === 'discount') {
                            typeLabel = 'Descuento';
                            if (camp.rules_config?.discount?.purpose) purposeHtml = `<p style="font-size:13px; margin:8px 0; color:var(--text-muted);">${camp.rules_config.discount.purpose}</p>`;
                            if (camp.rules_config?.discount?.conditions) termsHtml = `<p style="font-size:11px; margin-top:8px; color:rgba(0,0,0,0.5);">* ${camp.rules_config.discount.conditions}</p>`;
                        }
                        else if (camp.type === 'coupons') {
                            typeLabel = 'Cupón Promocional';
                            if (camp.rules_config?.coupons?.desc) purposeHtml = `<p style="font-size:13px; margin:8px 0; color:var(--text-muted);">${camp.rules_config.coupons.desc}</p>`;
                            if (camp.rules_config?.coupons?.terms) termsHtml = `<p style="font-size:11px; margin-top:8px; color:rgba(0,0,0,0.5);">* ${camp.rules_config.coupons.terms}</p>`;
                        }
                        else if (camp.type === 'multipass') {
                            typeLabel = 'Multipass';
                            if (camp.rules_config?.multipass?.service) purposeHtml = `<p style="font-size:13px; margin:8px 0; color:var(--text-muted);">${camp.rules_config.multipass.count} Pases para ${camp.rules_config.multipass.service}</p>`;
                        }
                        
                        card.innerHTML = `
                            <div class="campaign-type-badge">${typeLabel}</div>
                            <h3 class="campaign-name">${camp.name}</h3>
                            ${purposeHtml}
                            ${termsHtml}
                        `;
                        
                        card.addEventListener('click', () => {
                            selectedCampaignId = camp.id;
                            document.getElementById('selected-campaign-badge').textContent = `Campaña: ${camp.name}`;
                            if (camp.color_primary) {
                                document.getElementById('selected-campaign-badge').style.backgroundColor = camp.color_primary;
                                document.documentElement.style.setProperty('--primary', camp.color_primary);
                            }
                            
                            document.getElementById('campaigns-container').style.display = 'none';
                            document.getElementById('registration-form-container').style.display = 'block';
                        });
                        
                        grid.appendChild(card);
                    });
                }
                
                document.getElementById('campaigns-container').style.display = 'block';
                document.getElementById('loading-screen').style.display = 'none';

            } catch (err) {
                console.error(err);
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('registration-form-container').innerHTML = `
                    <div style="text-align:center; padding: 40px 0;">
                        <i class="fa-solid fa-store-slash" style="font-size:48px; color:var(--text-muted); margin-bottom:16px;"></i>
                        <h2>Restaurante/Negocio no encontrado</h2>
                        <p style="color:var(--text-muted); margin-top:8px;">Verifica que la dirección web sea correcta.</p>
                    </div>
                `;
                document.getElementById('registration-form-container').style.display = 'block';
            }
        });
        
        document.getElementById('btn-back').addEventListener('click', () => {
            document.getElementById('registration-form-container').style.display = 'none';
            document.getElementById('campaigns-container').style.display = 'block';
            // Reset primary color to merchant default
            if (merchantData && merchantData.color_primary) {
                document.documentElement.style.setProperty('--primary', merchantData.color_primary);
            }
        });

        // 6. Handle Registration
        document.getElementById('public-register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!selectedCampaignId) {
                Swal.fire('Error', 'Por favor selecciona una campaña primero.', 'warning');
                return;
            }
            
            const btn = document.getElementById('btn-submit');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creando Tarjeta...';
            btn.disabled = true;

            const fullName = document.getElementById('full_name').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const phone = document.getElementById('phone').value.trim();
            const birthdayInput = document.getElementById('birthday');
            const birthday = birthdayInput ? birthdayInput.value : null;
            const merchantId = document.getElementById('merchant_id').value;

            try {
                // Check if user already exists
                const { data: existing } = await supabase
                    .from('customers')
                    .select('id')
                    .eq('merchant_id', merchantId)
                    .eq('email', email)
                    .single();

                let customerId;
                
                if (existing) {
                    customerId = existing.id;
                } else {
                    // Insert new customer
                    const { data: newCustomer, error } = await supabase
                        .from('customers')
                        .insert([{
                            merchant_id: merchantId,
                            full_name: fullName,
                            email: email,
                            phone: phone || null,
                            birthday: birthday || null,
                            balance_cashback: 0,
                            stamps_count: 0,
                            vip_tier: 'Bronce'
                        }])
                        .select()
                        .single();

                    if (error) throw error;
                    customerId = newCustomer.id;
                }
                
                // Link customer to campaign
                const { data: existingLink } = await supabase
                    .from('customer_campaigns')
                    .select('id')
                    .eq('customer_id', customerId)
                    .eq('campaign_id', selectedCampaignId)
                    .single();
                    
                if (!existingLink) {
                    await supabase.from('customer_campaigns').insert([{
                        customer_id: customerId,
                        campaign_id: selectedCampaignId
                    }]);
                }

                // Success! Redirect to digital pass
                window.location.href = `/pass.html?id=${customerId}&campaign=${selectedCampaignId}`;

            } catch (err) {
                Swal.fire('Error', 'Hubo un problema al crear tu tarjeta. Intenta de nuevo.', 'error');
                console.error(err);
                btn.innerHTML = 'Generar Mi Tarjeta Digital';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
