<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fidelio | Actualizar Contraseña</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --fidelio-violet: #6C2BD9;
            --fidelio-violet-hover: #5B21B6;
            --bg-color: #FAFAFA;
            --card-bg: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border-light: #E5E7EB;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .recovery-container {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            border-color: var(--fidelio-violet);
            box-shadow: 0 0 0 3px rgba(108, 43, 217, 0.1);
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--fidelio-violet);
            color: #fff;
            padding: 14px 28px;
            border-radius: 9999px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-primary:hover {
            background: var(--fidelio-violet-hover);
            transform: translateY(-2px);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="recovery-container">
        <a href="/">
            <img src="./fidelio_logo_purple.png" alt="Fidelio Logo" style="height: 40px; margin-bottom: 24px;">
        </a>
        <h2 style="margin: 0 0 8px 0; color: var(--text-main); font-size: 24px;">Crea tu nueva contraseña</h2>
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 32px;">Escribe una contraseña segura y fácil de recordar para recuperar tu acceso.</p>

        <form id="form-update-password" onsubmit="return false;">
            <div class="form-group">
                <label class="form-label">Nueva Contraseña</label>
                <input type="password" id="newPassword" class="form-input" placeholder="Mínimo 6 caracteres" required>
            </div>
            <div class="form-group">
                <label class="form-label">Confirmar Contraseña</label>
                <input type="password" id="confirmPassword" class="form-input" placeholder="Repite tu contraseña" required>
            </div>
            
            <button type="submit" class="btn-primary" id="btn-submit">Guardar y Entrar &nbsp;&rarr;</button>
        </form>
        <p id="error-msg" style="color: #EF4444; font-size: 13px; margin-top: 16px; display: none;"></p>
    </div>

    <script>
        document.getElementById('form-update-password').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorMsg = document.getElementById('error-msg');
            const btn = document.getElementById('btn-submit');

            errorMsg.style.display = 'none';

            if (newPassword !== confirmPassword) {
                errorMsg.textContent = 'Las contraseñas no coinciden.';
                errorMsg.style.display = 'block';
                return;
            }

            if (newPassword.length < 6) {
                errorMsg.textContent = 'La contraseña debe tener al menos 6 caracteres.';
                errorMsg.style.display = 'block';
                return;
            }

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando...';
            btn.disabled = true;

            try {
                // Obtener configuración
                const configRes = await fetch('/api/config');
                const configData = await configRes.json();
                
                // Inicializar cliente
                const supabaseClient = window.supabase.createClient(configData.supabaseUrl, configData.supabaseAnonKey);

                // Supabase automatically handles the hash in the URL and sets the session.
                // We just need to call updateUser to save the new password.
                const { error } = await supabaseClient.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                // Success! Redirect to dashboard
                alert("¡Tu contraseña ha sido actualizada con éxito!");
                window.location.href = '/panel';
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.display = 'block';
                btn.innerHTML = 'Guardar y Entrar &nbsp;&rarr;';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
