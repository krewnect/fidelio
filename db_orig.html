            <section id="tab-global-db" class="tab-content">
                <div class="workspace-header">
                    <div>
                        <span class="workspace-eyebrow">ADMINISTRACIÓN CENTRAL</span>
                        <h1>Base de Datos Global</h1>
                        <p>Visión maestra de todos los usuarios (clientes finales) registrados en todo Fidelio.</p>
                    </div>
                    <button class="btn btn-outline" onclick="loadGlobalDatabase()"><i class="fa-solid fa-rotate-right"></i> Refrescar</button>
                </div>
                
                <div class="content-panel" style="background: var(--surface); border-radius: 20px; padding: 24px; box-shadow: var(--shadow-sm); overflow-x: auto;">

                        <input type="text" id="global-db-search" class="fidelio-input" placeholder="Buscar cliente por correo o nombre..." style="max-width: 400px;" oninput="filterGlobalDB(this.value)">

                    <table class="crm-table" style="width: 100%; border-collapse: collapse; text-align: left;">

                                <th style="padding: 16px;">Email</th>
                                <th style="padding: 16px;">ID Restaurante</th>
                                <th style="padding: 16px;">Fecha de Registro</th>
                            </tr>
                        </thead>
                        <tbody id="global-db-body">
                            <!-- Dynamic Content -->
                        </tbody>
                    </table>
                </div>
            </section>
