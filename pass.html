<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Digital</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #888888;
            --primary: #8b5cf6;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .pass-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .digital-card {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), #000);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .digital-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('https://www.transparenttextures.com/patterns/cubes.png');
            opacity: 0.1;
            pointer-events: none;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 2;
        }

        .merchant-logo {
            height: 40px;
            border-radius: 8px;
        }

        .vip-badge {
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: white;
            backdrop-filter: blur(4px);
        }

        .balance-section {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 2;
        }

        .balance-label {
            font-size: 11px;
            color: rgba(255,255,255,0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .balance-amount {
            font-family: 'Space Grotesk', monospace;
            font-size: 42px;
            font-weight: 700;
            line-height: 1;
        }

        .qr-container {
            background: white;
            padding: 16px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            width: fit-content;
            position: relative;
            z-index: 2;
        }

        .customer-name {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            font-weight: 600;
            position: relative;
            z-index: 2;
            color: rgba(255,255,255,0.9);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            margin-top: 20px;
        }

        .stat-box {
            background: var(--surface-color);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: white;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .instruction {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 24px;
        }

        #loading-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: white;
            font-size: 24px;
        }

        .btn-wallet {
            background: #000;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px 20px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            margin-top: 20px;
            text-decoration: none;
        }

    </style>
</head>
<body>

    <div id="loading-screen"><i class="fa-solid fa-spinner fa-spin"></i></div>

    <div class="pass-container" id="pass-container" style="display:none;">
        <div class="digital-card" id="digital-card">
            <div class="card-header">
                <img src="" id="ui-merchant-logo" class="merchant-logo" alt="Logo">
                <div class="vip-badge" id="ui-vip">BRONCE</div>
            </div>

            <div class="balance-section">
                <div class="balance-label">Cashback Disponible</div>
                <div class="balance-amount" id="ui-balance">$0.00</div>
            </div>

            <div class="qr-container" id="qrcode"></div>
            
            <div class="customer-name" id="ui-customer-name">Cargando...</div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-value" id="ui-stamps">0</div>
                <div class="stat-label">Sellos Ganados</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="ui-visits">0</div>
                <div class="stat-label">Visitas Totales</div>
            </div>
        </div>

        <p class="instruction">
            Presenta este código QR al cajero al momento de pagar para acumular o canjear tus recompensas.
        </p>

        <button class="btn-wallet" onclick="alert('Esta función se habilitará próximamente tras la certificación de Apple Developer.')">
            <i class="fa-brands fa-apple"></i> Añadir a Apple Wallet
        </button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // 1. Init Supabase
                const configRes = await fetch('/api/config');
                const config = await configRes.json();
                const supabase = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
                
                // 2. Get ID
                const urlParams = new URLSearchParams(window.location.search);
                const customerId = urlParams.get('id') || urlParams.get('c');
                
                if (!customerId) {
                    throw new Error("Pase no encontrado");
                }

                // 3. Fetch Customer
                const { data: customer, error: cErr } = await supabase
                    .from('customers')
                    .select('*')
                    .eq('id', customerId)
                    .single();

                if (cErr || !customer) throw new Error("Cliente no encontrado");

                // 4. Fetch Merchant
                const { data: merchant, error: mErr } = await supabase
                    .from('merchants')
                    .select('business_name, logo_url, color_primary')
                    .eq('id', customer.merchant_id)
                    .single();

                // 5. Populate UI
                document.title = `Tarjeta Digital - ${merchant ? merchant.business_name : 'Fidelio'}`;
                
                document.getElementById('ui-customer-name').textContent = customer.full_name || customer.name;
                document.getElementById('ui-balance').textContent = `$${parseFloat(customer.balance_cashback || 0).toFixed(2)}`;
                document.getElementById('ui-stamps').textContent = customer.stamps_count || 0;
                document.getElementById('ui-visits').textContent = customer.visits || 0;
                document.getElementById('ui-vip').textContent = customer.vip_tier || 'BRONCE';

                if (merchant) {
                    document.getElementById('ui-merchant-logo').src = merchant.logo_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(merchant.business_name)}&background=000&color=fff`;
                    if (merchant.color_primary) {
                        document.documentElement.style.setProperty('--primary', merchant.color_primary);
                    }
                }

                // 6. Generate QR Code
                new QRCode(document.getElementById("qrcode"), {
                    text: customer.id, // This is what the Scanner will read!
                    width: 150,
                    height: 150,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });

                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('pass-container').style.display = 'flex';

            } catch (err) {
                console.error(err);
                document.getElementById('loading-screen').innerHTML = `
                    <div style="text-align:center;">
                        <i class="fa-solid fa-triangle-exclamation" style="font-size:48px; color:var(--text-muted); margin-bottom:16px;"></i>
                        <h2 style="margin-bottom:8px;">Pase Inválido</h2>
                        <p style="color:var(--text-muted); font-size:14px;">El enlace no es válido o ha expirado.</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
