<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Digital</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #888888;
            --primary: #8b5cf6;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .pass-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .digital-card {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), #000);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .digital-card-banner {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.3;
            z-index: 0;
            pointer-events: none;
        }

        .digital-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('https://www.transparenttextures.com/patterns/cubes.png');
            opacity: 0.1;
            pointer-events: none;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 2;
        }

        .merchant-logo {
            height: 40px;
            border-radius: 8px;
        }

        .vip-badge {
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: white;
            backdrop-filter: blur(4px);
        }
        
        .campaign-title {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            position: relative;
            z-index: 2;
        }

        .balance-section, .stamps-section {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 2;
        }

        .balance-label, .stamps-label {
            font-size: 11px;
            color: rgba(255,255,255,0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .balance-amount, .stamps-amount {
            font-family: 'Space Grotesk', monospace;
            font-size: 42px;
            font-weight: 700;
            line-height: 1;
        }

        .qr-container {
            background: white;
            padding: 16px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            width: fit-content;
            position: relative;
            z-index: 2;
        }

        .customer-name {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            font-weight: 600;
            position: relative;
            z-index: 2;
            color: rgba(255,255,255,0.9);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            margin-top: 20px;
        }

        .stat-box {
            background: var(--surface-color);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: white;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .instruction {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 24px;
        }

        #loading-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: white;
            font-size: 24px;
        }

        .btn-wallet {
            background: #000;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px 20px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            margin-top: 20px;
            text-decoration: none;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--surface-color);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .form-input {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-family: inherit;
        }

        .btn-schedule {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-weight: 700;
            width: 100%;
            margin-top: 16px;
            cursor: pointer;
        }

    
        .stamps-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-top: 15px;
            margin-bottom: 20px;
            justify-items: center;
        }
        .stamp-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px dashed rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255,255,255,0.05);
            transition: all 0.3s ease;
            position: relative;
        }
        .stamp-circle.earned {
            border: 2px solid var(--primary);
            background-color: rgba(255,255,255,0.9);
            box-shadow: 0 0 10px var(--primary);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .stamp-image {
            width: 70%;
            height: 70%;
            object-fit: contain;
            border-radius: 50%;
        }
        .stamp-icon {
            font-size: 20px;
            color: var(--primary);
        }
        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

    </style>
</head>
<body>

    <div id="loading-screen"><i class="fa-solid fa-spinner fa-spin"></i></div>

    <div class="pass-container" id="pass-container" style="display:none;">
        <div class="digital-card" id="digital-card">
            <div class="digital-card-banner" id="ui-card-banner"></div>
            
            <div class="card-header">
                <img src="" id="ui-merchant-logo" class="merchant-logo" alt="Logo">
                <div class="vip-badge" id="ui-vip">BRONCE</div>
            </div>
            
            <div class="campaign-title" id="ui-campaign-title"></div>

            <div class="balance-section" id="ui-balance-section" style="display:none;">
                <div class="balance-label">Cashback Disponible</div>
                <div class="balance-amount" id="ui-balance">$0.00</div>
            </div>
            
            <div class="stamps-section" id="ui-stamps-section" style="display:none;">
                <div class="stamps-label">Sellos Acumulados</div>
                <div class="stamps-grid" id="ui-stamps-grid"></div>
            </div>

            <div class="qr-container" id="qrcode"></div>
            
            <div class="customer-name" id="ui-customer-name">Cargando...</div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-value" id="ui-stamps-stat">0</div>
                <div class="stat-label">Sellos Ganados</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="ui-visits">0</div>
                <div class="stat-label">Visitas Totales</div>
            </div>
        </div>

        <p class="instruction">
            Presenta este código QR al cajero al momento de pagar para acumular o canjear tus recompensas.
        </p>

        <button class="btn-wallet" id="btn-schedule-appointment" style="display:none; background: var(--primary); margin-bottom: 12px; color: white;" onclick="openAppointmentModal()">
            <i class="fa-solid fa-calendar-check"></i> <span id="ui-cta-text">Agendar Cita o Servicio</span>
        </button>

        <button class="btn-wallet" onclick="alert('Esta función se habilitará próximamente tras la certificación de Apple Developer.')">
            <i class="fa-brands fa-apple"></i> Añadir a Apple Wallet
        </button>
    </div>

    <div class="modal-overlay" id="appointment-modal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3 style="margin:0; font-size:18px;">Agendar Cita o Servicio</h3>
                <i class="fa-solid fa-xmark" style="cursor:pointer; color:var(--text-muted);" onclick="closeAppointmentModal()"></i>
            </div>
            
            <div class="form-group">
                <label>Día de la cita</label>
                <input type="date" class="form-input" id="modal-date">
            </div>
            <div class="form-group">
                <label>Hora deseada</label>
                <input type="time" class="form-input" id="modal-time">
            </div>
            
            <button class="btn-schedule" id="btn-confirm-appointment" onclick="confirmAppointment()">Confirmar Solicitud</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // 1. Init Supabase
                const configRes = await fetch('/api/config');
                const config = await configRes.json();
                const supabase = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
                
                // 2. Get IDs
                const urlParams = new URLSearchParams(window.location.search);
                const customerId = urlParams.get('id') || urlParams.get('c');
                const campaignId = urlParams.get('campaign');
                
                if (!customerId || !campaignId) {
                    throw new Error("Pase o campaña no encontrados");
                }

                // 3. Fetch Customer
                const { data: customer, error: cErr } = await supabase
                    .from('customers')
                    .select('*')
                    .eq('id', customerId)
                    .single();

                if (cErr || !customer) throw new Error("Cliente no encontrado");

                // 4. Fetch Campaign
                const { data: campaign, error: campErr } = await supabase
                    .from('campaigns')
                    .select('*')
                    .eq('id', campaignId)
                    .single();
                    
                if (campErr || !campaign) throw new Error("Campaña no encontrada");

                // 5. Fetch Merchant for fallback/business_type
                const { data: merchant, error: mErr } = await supabase
                    .from('merchants')
                    .select('business_name, business_type')
                    .eq('id', customer.merchant_id)
                    .single();

                // 6. Populate UI based on Campaign
                document.title = \`Tarjeta Digital - \${campaign.name || 'Campaña'}\`;
                
                document.getElementById('ui-customer-name').textContent = customer.full_name || customer.name;
                document.getElementById('ui-campaign-title').textContent = campaign.name;
                document.getElementById('ui-vip').textContent = customer.vip_tier || 'BRONCE';

                // Stats mapping
                document.getElementById('ui-balance').textContent = \`$\${parseFloat(customer.balance_cashback || 0).toFixed(2)}\`;
                
                // Generar Cuadrícula de Sellos Visual
                const gridContainer = document.getElementById('ui-stamps-grid');
                if (gridContainer) {
                    const totalStampsReq = (campaign.rules_config && campaign.rules_config.stamps_total) ? campaign.rules_config.stamps_total : 10;
                    const earnedStamps = customer.stamps_count || 0;
                    gridContainer.innerHTML = '';
                    
                    // Ajustar columnas dinámicamente si hay muchos sellos
                    if (totalStampsReq > 10) gridContainer.style.gridTemplateColumns = 'repeat(6, 1fr)';
                    if (totalStampsReq <= 5) gridContainer.style.gridTemplateColumns = `repeat(${totalStampsReq}, 1fr)`;

                    const iconSrc = campaign.stamp_icon_url || 'fa-star';
                    const isImage = iconSrc.startsWith('data:image') || iconSrc.startsWith('http');
                    
                    for (let i = 0; i < totalStampsReq; i++) {
                        const circle = document.createElement('div');
                        circle.className = 'stamp-circle' + (i < earnedStamps ? ' earned' : '');
                        
                        if (i < earnedStamps) {
                            if (isImage) {
                                circle.innerHTML = `<img src="${iconSrc}" class="stamp-image">`;
                            } else {
                                circle.innerHTML = `<i class="fa-solid ${iconSrc} stamp-icon"></i>`;
                            }
                        }
                        
                        gridContainer.appendChild(circle);
                    }
                }

                
                document.getElementById('ui-stamps-stat').textContent = customer.stamps_count || 0;
                document.getElementById('ui-visits').textContent = customer.visits || 0;
                
                // Show relevant section based on campaign type
                if (campaign.type === 'stamps') {
                    document.getElementById('ui-stamps-section').style.display = 'block';
                } else {
                    document.getElementById('ui-balance-section').style.display = 'block';
                }

                // Branding
                document.getElementById('ui-merchant-logo').src = campaign.logo_url || (merchant ? \`https://ui-avatars.com/api/?name=\${encodeURIComponent(merchant.business_name)}&background=000&color=fff\` : \`https://ui-avatars.com/api/?name=F&background=000&color=fff\`);
                
                if (campaign.color_primary) {
                    document.documentElement.style.setProperty('--primary', campaign.color_primary);
                }
                
                if (campaign.banner_url) {
                    document.getElementById('ui-card-banner').style.backgroundImage = \`url('\${campaign.banner_url}')\`;
                }

                
                if (merchant && merchant.business_type === 'professional') {
                    document.getElementById('ui-vip').style.display = 'none';
                    const btnAppt = document.getElementById('btn-schedule-appointment');
                    btnAppt.style.display = 'block';
                    
                    // Update label if custom
                    if (campaign.custom_cta_label) {
                        document.getElementById('ui-cta-text').textContent = campaign.custom_cta_label;
                    }
                    
                    // Check if Stripe is configured
                    if (merchant.stripe_keys && merchant.stripe_keys.stripe_pub_key) {
                        // Change action to Stripe if they provided a payment link in custom_cta_url or default
                        btnAppt.onclick = () => {
                            if (campaign.banner_url && campaign.banner_url.includes('stripe.com')) {
                                window.location.href = campaign.banner_url; // We'll hijack banner_url for stripe link as hack for now
                            } else {
                                alert('El profesional tiene Stripe activo pero no configuró su Payment Link.');
                            }
                        };
                        document.getElementById('ui-cta-text').innerHTML += " (Pagar vía Stripe)";
                    }
                }


                // 7. Generate QR Code (CUSTOMER_ID|CAMPAIGN_ID)
                const qrContent = \`\${customer.id}|\${campaign.id}\`;
                new QRCode(document.getElementById("qrcode"), {
                    text: qrContent,
                    width: 150,
                    height: 150,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });

                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('pass-container').style.display = 'flex';

            } catch (err) {
                console.error(err);
                document.getElementById('loading-screen').innerHTML = \`
                    <div style="text-align:center;">
                        <i class="fa-solid fa-triangle-exclamation" style="font-size:48px; color:var(--text-muted); margin-bottom:16px;"></i>
                        <h2 style="margin-bottom:8px;">Pase Inválido</h2>
                        <p style="color:var(--text-muted); font-size:14px;">El enlace no es válido o la campaña ha expirado.</p>
                    </div>
                \`;
            }
        });

        function openAppointmentModal() {
            document.getElementById('appointment-modal').style.display = 'flex';
        }

        function closeAppointmentModal() {
            document.getElementById('appointment-modal').style.display = 'none';
        }

        async function confirmAppointment() {
            const dateStr = document.getElementById('modal-date').value;
            const timeStr = document.getElementById('modal-time').value;
            
            if(!dateStr || !timeStr) {
                Swal.fire('Error', 'Selecciona el día y la hora', 'error');
                return;
            }

            const btn = document.getElementById('btn-confirm-appointment');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Agendando...';
            btn.disabled = true;

            try {
                // Get customer data globally saved during init
                const urlParams = new URLSearchParams(window.location.search);
                const customerId = urlParams.get('id') || urlParams.get('c');
                
                const configRes = await fetch('/api/config');
                const config = await configRes.json();
                const supabase = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);

                const { data: customer } = await supabase.from('customers').select('*').eq('id', customerId).single();
                
                if(customer) {
                    const appointmentDate = new Date(\`\${dateStr}T\${timeStr}\`);
                    const { error } = await supabase.from('appointments').insert([{
                        merchant_id: customer.merchant_id,
                        customer_id: customer.id,
                        customer_name: customer.full_name || customer.name,
                        customer_phone: customer.phone || null,
                        customer_email: customer.email,
                        appointment_date: appointmentDate.toISOString()
                    }]);
                    
                    if (error) throw error;
                    
                    Swal.fire('¡Solicitud Enviada!', 'El profesional ha recibido tu solicitud.', 'success');
                    closeAppointmentModal();
                }
            } catch (err) {
                console.error(err);
                Swal.fire('Error', 'Hubo un problema. Intenta de nuevo.', 'error');
            }
            
            btn.innerHTML = 'Confirmar Solicitud';
            btn.disabled = false;
        }
    </script>
</body>
</html>
