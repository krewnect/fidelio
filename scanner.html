<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terminal Fidelio</title>
    
    <!-- PWA / Native App tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#090d16">
    <link rel="apple-touch-icon" href="./fidelio-logo-official.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Scanner">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- QR Code Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
    
    <style>
        :root {
            --bg-dark: #090d16;
            --surface: #111827;
            --surface-light: #1f2937;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        header {
            padding: 20px;
            text-align: center;
            background: var(--surface);
            border-bottom: 1px solid var(--surface-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-weight: 800; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
        
        /* Main Container */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        /* Scanner Area */
        #reader-container {
            width: 100%;
            background: black;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 2px solid var(--surface-light);
        }
        #reader { width: 100%; min-height: 300px; }
        
        /* States */
        .loading { display: flex; justify-content: center; align-items: center; height: 100%; font-size: 1.2rem; color: var(--text-muted); }
        .error { color: var(--danger); text-align: center; padding: 20px; background: rgba(239, 68, 68, 0.1); border-radius: 12px; margin-top: 20px; }
        
        /* Customer Action Panel (Hidden by default) */
        #action-panel {
            display: none;
            background: var(--surface);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--surface-light);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .customer-header { text-align: center; margin-bottom: 24px; }
        .customer-name { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
        .customer-balance { font-size: 2rem; color: var(--success); font-weight: 800; }
        .customer-balance span { font-size: 1rem; color: var(--text-muted); font-weight: 400; }

        /* Form */
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem; }
        .amount-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .amount-wrapper i { position: absolute; left: 16px; font-size: 1.2rem; color: var(--text-muted); }
        input[type="number"] {
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid var(--surface-light);
            color: white;
            padding: 16px 16px 16px 40px;
            font-size: 1.5rem;
            border-radius: 12px;
            font-weight: 700;
        }
        input[type="number"]:focus { outline: none; border-color: var(--primary); }

        /* Buttons */
        .btn-group { display: flex; gap: 12px; margin-top: 24px; }
        button {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; transform: scale(0.98); }
        .btn-earn { background: var(--primary); }
        .btn-redeem { background: var(--surface-light); color: var(--text-main); }
        .btn-cancel { background: transparent; border: 1px solid var(--surface-light); margin-top: 12px; width: 100%; }

        /* Status overlay */
        #status-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(9, 13, 22, 0.95);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100;
        }
        .status-icon { font-size: 4rem; margin-bottom: 16px; }
        .status-success { color: var(--success); }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <img src="./fidelio-logo-official.png" alt="Fidelio Logo" style="height: 32px; width: auto;" />
            <span style="font-size: 14px; font-weight: 500; color: var(--text-muted);">Terminal</span>
        </div>
        <div id="merchant-name" style="font-size: 0.9rem; color: var(--text-muted);">Cargando...</div>
    </header>

    <div class="container" id="main-container">
        
        <!-- Mode Switcher -->
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button id="btn-mode-scan" class="btn-primary" style="flex:1; padding:12px; border-radius:12px; font-size:1rem; border:none; background:var(--primary);" onclick="setMode('scan')"><i class="fa-solid fa-qrcode"></i> Escanear</button>
            <button id="btn-mode-manual" class="btn-secondary" style="flex:1; padding:12px; border-radius:12px; font-size:1rem; background:var(--surface-light); color:white; border:none;" onclick="setMode('manual')"><i class="fa-solid fa-keyboard"></i> Búsqueda Manual</button>
        </div>

        <!-- Scanner -->
        <div id="scanner-section">
            <div id="reader-container">
                <div id="reader"></div>
            </div>
            <p style="text-align:center; color:var(--text-muted); font-size:0.9rem;" id="scan-hint">
                Apunta la cámara al pase de Apple/Google Wallet del cliente.
            </p>
        </div>

        <!-- Manual Search (Hidden initially) -->
        <div id="manual-section" style="display:none; background:var(--surface); padding:24px; border-radius:16px; border:1px solid var(--surface-light); margin-bottom:20px;">
            <h3 style="margin-bottom:16px; text-align:center;">Búsqueda Delivery / Remota</h3>
            <div class="input-group">
                <label>Teléfono o Correo Electrónico</label>
                <input type="text" id="manual-search-input" style="width:100%; padding:14px; border-radius:8px; border:1px solid var(--surface-light); background:var(--bg-dark); color:white; font-size:1.1rem;" placeholder="ej. 5512345678 o correo@mail.com">
            </div>
            <button class="btn-primary" style="width:100%; padding:14px; border-radius:12px; font-weight:700; background:var(--primary); color:white; border:none; margin-top:8px;" onclick="searchCustomerManual()" id="btn-manual-search">
                <i class="fa-solid fa-magnifying-glass"></i> Buscar Cliente
            </button>
            <p id="manual-search-error" style="color:var(--danger); text-align:center; margin-top:12px; font-size:0.9rem; display:none;"></p>
        </div>

        <!-- Action Panel -->
        <div id="action-panel">
            <div class="customer-header">
                <div class="customer-name" id="c-name">Cargando...</div>
                <div class="customer-balance" id="c-balance">$0.00 <span>MXN Disponibles</span></div>
            </div>

            <div class="input-group">
                <label>Monto del Consumo (Ticket)</label>
                <div class="amount-wrapper">
                    <i class="fa-solid fa-dollar-sign"></i>
                    <input type="number" id="ticket-amount" placeholder="0.00" step="0.01">
                </div>
            </div>

            <div class="btn-group">
                <button class="btn-earn" id="btn-earn" onclick="processTransaction('earn')">
                    <i class="fa-solid fa-coins"></i> Dar Puntos
                </button>
                <button class="btn-redeem" id="btn-redeem" onclick="processTransaction('redeem')">
                    <i class="fa-solid fa-money-bill-wave"></i> Cobrar
                </button>
            </div>
            
            <button class="btn-cancel" onclick="resetScanner()">
                Cancelar
            </button>
        </div>

    </div>

    <!-- Login Screen -->
    <div id="login-screen" style="display:none; position:fixed; inset:0; background:var(--bg-dark); z-index:200; padding:20px; display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <div style="text-align:center; margin-bottom:40px;">
            <i class="fa-solid fa-qrcode" style="font-size:3rem; color:var(--primary); margin-bottom:16px;"></i>
            <h2>Fidelio Terminal</h2>
            <p style="color:var(--text-muted); margin-top:8px;">Acceso exclusivo para Staff</p>
        </div>
        <div style="width:100%; max-width:350px;">
            <div style="margin-bottom:16px;">
                <label style="display:block; margin-bottom:8px; font-size:0.9rem; color:var(--text-muted);">Correo</label>
                <input type="email" id="login-email" style="width:100%; padding:12px; border-radius:8px; border:1px solid var(--surface-light); background:var(--surface); color:white;" placeholder="cajero@tuempresa.com">
            </div>
            <div style="margin-bottom:24px;">
                <label style="display:block; margin-bottom:8px; font-size:0.9rem; color:var(--text-muted);">Contraseña</label>
                <input type="password" id="login-password" style="width:100%; padding:12px; border-radius:8px; border:1px solid var(--surface-light); background:var(--surface); color:white;" placeholder="******">
            </div>
            <button id="btn-login" style="width:100%; padding:14px; border-radius:8px; border:none; background:var(--primary); color:white; font-weight:600; font-size:1rem;" onclick="handleLogin()">
                Iniciar Sesión
            </button>
            <p id="login-error" style="color:var(--danger); text-align:center; margin-top:16px; font-size:0.9rem; display:none;"></p>
        </div>
    </div>

    <!-- Success Overlay -->
    <div id="status-overlay">
        <i class="fa-solid fa-circle-check status-icon status-success"></i>
        <h2 style="font-size: 2rem; margin-bottom: 8px;">¡Éxito!</h2>
        <p id="status-msg" style="color: var(--text-muted);">Transacción procesada.</p>
        <button class="btn-primary" style="margin-top:24px; width:80%; max-width:300px; padding:16px; border-radius:12px; background:var(--primary); color:white; font-weight:700; border:none;" onclick="resetScanner()">Escanear Siguiente</button>
    </div>

    <script>
        let supabaseClient;
        let html5QrcodeScanner;
        let currentCustomerId = null;
        let merchantSession = null;

        async function init() {
            try {
                // 1. Get Config
                const res = await fetch('/api/config');
                const config = await res.json();
                supabaseClient = supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);

                // 2. Check Auth
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) {
                    showLoginScreen();
                    return;
                }
                
                await setupScannerSession(session);
            } catch (err) {
                console.error("Error iniciando escáner:", err);
                alert("Error de conexión con el servidor.");
            }
        }

        function showLoginScreen() {
            document.getElementById('main-container').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
        }

        async function handleLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('btn-login');
            const errLabel = document.getElementById('login-error');
            
            if(!email || !password) return;
            
            btn.disabled = true;
            btn.textContent = "Verificando...";
            errLabel.style.display = 'none';

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            if (error) {
                errLabel.textContent = "Credenciales incorrectas.";
                errLabel.style.display = 'block';
                btn.disabled = false;
                btn.textContent = "Iniciar Sesión";
                return;
            }

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-container').style.display = 'block';
            await setupScannerSession(data.session);
        }

        async function setupScannerSession(session) {
            merchantSession = session;
            const role = session.user.user_metadata?.role;
            const targetMerchantId = role === 'staff' ? session.user.user_metadata.merchant_id : session.user.id;
            
            // Load Merchant info
            const { data: merchant } = await supabaseClient
                .from('merchants')
                .select('business_name')
                .eq('id', targetMerchantId)
                .single();
                
            if (merchant) {
                let badge = role === 'staff' ? ' (Cajero)' : ' (Dueño)';
                document.getElementById('merchant-name').textContent = merchant.business_name + badge;
            }

            // 3. Start Scanner
            startScanner();
        }

        function startScanner() {
            document.getElementById('action-panel').style.display = 'none';
            document.getElementById('reader-container').style.display = 'block';
            document.getElementById('scan-hint').style.display = 'block';
            
            html5QrcodeScanner = new Html5Qrcode("reader");
            
            // Configurar la cámara trasera (environment)
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            
            html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess, onScanFailure)
            .catch(err => {
                console.error("Error iniciando cámara:", err);
                document.getElementById('reader').innerHTML = '<div class="error">No se pudo acceder a la cámara. Revisa los permisos de tu navegador.</div>';
            });
        }

        async function onScanSuccess(decodedText, decodedResult) {
            // Detener el escáner al leer un código
            html5QrcodeScanner.stop();
            document.getElementById('reader-container').style.display = 'none';
            document.getElementById('scan-hint').style.display = 'none';
            document.getElementById('action-panel').style.display = 'block';
            
            currentCustomerId = decodedText; // El QR debe contener el ID del cliente
            document.getElementById('c-name').textContent = "Buscando cliente...";
            document.getElementById('c-balance').innerHTML = "...";
            
            // Fetch customer data from API
            try {
                const res = await fetch(`/api/scanner/customer/${currentCustomerId}`, {
                    headers: { 'Authorization': `Bearer ${merchantSession.access_token}` }
                });
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('c-name').textContent = data.customer.name;
                    document.getElementById('c-balance').innerHTML = `$${data.customer.current_balance.toFixed(2)} <span>MXN</span>`;
                } else {
                    alert("Error: " + data.error);
                    resetScanner();
                }
            } catch (err) {
                alert("Error conectando con el servidor");
                resetScanner();
            }
        }

        function onScanFailure(error) {
            // Se ejecuta constantemente mientras no encuentre QR, no hacemos nada.
        }

        function setMode(mode) {
            document.getElementById('action-panel').style.display = 'none';
            document.getElementById('manual-search-error').style.display = 'none';
            document.getElementById('manual-search-input').value = '';

            if (mode === 'scan') {
                document.getElementById('manual-section').style.display = 'none';
                document.getElementById('btn-mode-manual').style.background = 'var(--surface-light)';
                document.getElementById('btn-mode-manual').style.color = 'white';
                document.getElementById('btn-mode-scan').style.background = 'var(--primary)';
                
                document.getElementById('scanner-section').style.display = 'block';
                if (!html5QrcodeScanner) {
                    startScanner();
                } else {
                    // html5-qrcode doesn't have a reliable getState, so we just try to restart
                    try { html5QrcodeScanner.clear(); } catch(e){}
                    startScanner();
                }
            } else {
                document.getElementById('scanner-section').style.display = 'none';
                document.getElementById('btn-mode-scan').style.background = 'var(--surface-light)';
                document.getElementById('btn-mode-scan').style.color = 'white';
                document.getElementById('btn-mode-manual').style.background = 'var(--primary)';
                
                document.getElementById('manual-section').style.display = 'block';
                if (html5QrcodeScanner) {
                    try { html5QrcodeScanner.stop(); } catch(e){}
                }
            }
        }

        async function searchCustomerManual() {
            const query = document.getElementById('manual-search-input').value.trim();
            const errEl = document.getElementById('manual-search-error');
            const btn = document.getElementById('btn-manual-search');
            
            if (!query) {
                errEl.textContent = "Ingresa un teléfono o correo";
                errEl.style.display = 'block';
                return;
            }
            
            errEl.style.display = 'none';
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Buscando...';
            btn.disabled = true;

            try {
                let column = query.includes('@') ? 'email' : 'phone';
                
                // Extraer el merchant_id de la sesión del cajero
                // El cajero pertenece a un merchant
                const { data: userData } = await supabaseClient.auth.getUser();
                const merchantId = userData.user.user_metadata.merchant_id || userData.user.id;
                
                const { data: customer, error } = await supabaseClient
                    .from('customers')
                    .select('*')
                    .eq('merchant_id', merchantId)
                    .eq(column, query)
                    .single();

                if (error || !customer) {
                    errEl.textContent = "Cliente no encontrado. Pídele que se registre escaneando tu QR.";
                    errEl.style.display = 'block';
                } else {
                    document.getElementById('manual-section').style.display = 'none';
                    document.getElementById('action-panel').style.display = 'block';
                    
                    currentCustomerId = customer.id;
                    document.getElementById('c-name').textContent = customer.name || "Invitado";
                    document.getElementById('c-balance').innerHTML = `$${(customer.current_balance || 0).toFixed(2)} <span>MXN</span>`;
                }
            } catch (err) {
                errEl.textContent = "Error al buscar cliente";
                errEl.style.display = 'block';
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function resetScanner() {
            document.getElementById('status-overlay').style.display = 'none';
            document.getElementById('ticket-amount').value = '';
            currentCustomerId = null;
            document.getElementById('action-panel').style.display = 'none';
            
            const isManual = document.getElementById('manual-section').style.display === 'block';
            if (isManual) {
                setMode('manual');
            } else {
                setMode('scan');
            }
        }

        async function processTransaction(type) {
            const amountStr = document.getElementById('ticket-amount').value;
            const amount = parseFloat(amountStr);
            
            if (isNaN(amount) || amount <= 0) {
                alert("Ingresa un monto válido.");
                return;
            }

            const btnId = type === 'earn' ? 'btn-earn' : 'btn-redeem';
            const btn = document.getElementById(btnId);
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Procesando...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/scanner/transaction', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${merchantSession.access_token}`
                    },
                    body: JSON.stringify({
                        customerId: currentCustomerId,
                        amount: amount,
                        type: type
                    })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('status-overlay').style.display = 'flex';
                    if (type === 'earn') {
                        document.getElementById('status-msg').textContent = `Se otorgaron $${data.pointsEarned.toFixed(2)} MXN en Cashback.`;
                    } else {
                        document.getElementById('status-msg').textContent = `Se cobraron $${data.amountRedeemed.toFixed(2)} MXN con éxito.`;
                    }
                } else {
                    alert("Error: " + data.error);
                }
            } catch (err) {
                alert("Error conectando con el servidor.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // Run
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
